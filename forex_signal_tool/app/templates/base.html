<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FXシグナルツール{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-graph-up-arrow text-success me-2"></i>FXシグナルツール
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>ダッシュボード
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/signals' in request.path %}active{% endif %}" href="/signals">
            <i class="bi bi-lightning-charge me-1"></i>シグナル
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/backtest' in request.path %}active{% endif %}" href="/backtest">
            <i class="bi bi-bar-chart-line me-1"></i>バックテスト
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/reports' in request.path %}active{% endif %}" href="/reports">
            <i class="bi bi-file-earmark-text me-1"></i>レポート
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/settings' in request.path %}active{% endif %}" href="/settings/">
            <i class="bi bi-gear me-1"></i>設定
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center text-secondary small">
        <i class="bi bi-clock me-1"></i>
        <span id="current-time">--:--:--</span>
        <span class="ms-2">UTC</span>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid py-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script>
  // 時計
  function updateClock() {
    const now = new Date();
    const h = String(now.getUTCHours()).padStart(2, '0');
    const m = String(now.getUTCMinutes()).padStart(2, '0');
    const s = String(now.getUTCSeconds()).padStart(2, '0');
    document.getElementById('current-time').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
