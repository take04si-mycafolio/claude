<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}FXシグナル{% endblock %}</title>
  <meta name="google-site-verification" content="EHMpza91pPyqcTlIEP0-8u5kAOu33YoGZfM9l8coBhA" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head_extra %}{% endblock %}
</head>
<body>

<!-- ヘッダー -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-logo">
      <i class="bi bi-graph-up-arrow"></i>
      <span>FXシグナル</span>
    </div>
    <div class="header-time" id="current-time">--:--:-- UTC</div>
  </div>
</header>

<!-- メインコンテンツ -->
<main class="app-main">
  {% block content %}{% endblock %}
</main>

<!-- ボトムナビゲーション -->
<nav class="bottom-nav">
  <a href="/index.html" class="bottom-nav-item {% if active_page == 'home' %}active{% endif %}">
    <i class="bi bi-speedometer2"></i>
    <span>ホーム</span>
  </a>
  <a href="/signals.html" class="bottom-nav-item {% if active_page == 'signals' %}active{% endif %}">
    <i class="bi bi-lightning-charge"></i>
    <span>シグナル</span>
  </a>
  <a href="/backtest.html" class="bottom-nav-item {% if active_page == 'backtest' %}active{% endif %}">
    <i class="bi bi-bar-chart-line"></i>
    <span>分析</span>
  </a>
  <a href="/reports.html" class="bottom-nav-item {% if active_page == 'reports' %}active{% endif %}">
    <i class="bi bi-file-earmark-text"></i>
    <span>レポート</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ===== info-tip ツールチップ（JS版・body直下に生成） ===== */
(function() {
  var popup = null;
  function showTip(el) {
    hideTip();
    var text = el.getAttribute('data-tip');
    if (!text) return;
    popup = document.createElement('div');
    popup.className = 'tooltip-popup';
    popup.textContent = text;
    document.body.appendChild(popup);
    var rect = el.getBoundingClientRect();
    var W = 230;
    var left = rect.left + window.scrollX + rect.width / 2 - W / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - W - 8));
    popup.style.width = W + 'px';
    popup.style.left = left + 'px';
    popup.style.top = (rect.top + window.scrollY - popup.offsetHeight - 10) + 'px';
    popup.style.opacity = '1';
  }
  function hideTip() {
    if (popup) { popup.remove(); popup = null; }
  }
  document.addEventListener('mouseover', function(e) {
    var el = e.target.closest('.info-tip');
    if (el) showTip(el); else hideTip();
  });
  document.addEventListener('click', function(e) {
    var el = e.target.closest('.info-tip');
    if (el) { e.stopPropagation(); popup ? hideTip() : showTip(el); }
    else hideTip();
  });
})();
</script>
<script>
  function updateClock() {
    const now = new Date();
    const jst = new Date(now.getTime() + 9 * 3600 * 1000);
    const h = String(jst.getUTCHours()).padStart(2,'0');
    const m = String(jst.getUTCMinutes()).padStart(2,'0');
    const s = String(jst.getUTCSeconds()).padStart(2,'0');
    document.getElementById('current-time').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
