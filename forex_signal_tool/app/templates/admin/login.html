<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理パネル ログイン | AI×FX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:40px 36px;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;color:#f1f5f9;letter-spacing:.5px}
.login-logo p{font-size:13px;color:#64748b;margin-top:4px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;font-weight:500}
input[type=password]{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px;color:#f1f5f9;font-size:15px;outline:none;transition:border-color .2s}
input[type=password]:focus{border-color:#3b82f6}
.btn-login{margin-top:20px;width:100%;background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:11px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-login:hover{background:#2563eb}
.error-msg{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <h1>AI×FX</h1>
    <p>管理パネル</p>
  </div>
  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>パスワード</label>
    <input type="password" name="password" autofocus placeholder="管理者パスワード">
    <button type="submit" class="btn-login">ログイン</button>
  </form>
</div>
</body>
</html>
