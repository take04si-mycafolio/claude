<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>設定 - FXシグナル</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ヘッダー -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-logo">
      <i class="bi bi-graph-up-arrow"></i>
      <span>FXシグナル</span>
    </div>
    <div class="header-time" id="current-time">--:--:-- UTC</div>
  </div>
</header>

<!-- メインコンテンツ -->
<main class="app-main">

<div class="page-title">
  <i class="bi bi-gear-fill me-2"></i>設定
</div>

<div id="save-status" class="action-status mb-3 mx-3" style="display:none"></div>

<div class="section-card">
  <div class="section-title">バックテスト設定</div>
  <div class="setting-item">
    <label class="setting-label">初期資金（円）</label>
    <input type="number" class="setting-input" id="s-initial-capital" value="1000000" min="10000" step="10000">
    <div class="setting-hint">シミュレーション資金</div>
  </div>
  <div class="setting-item">
    <label class="setting-label">ストップロス（pips）</label>
    <input type="number" class="setting-input" id="s-sl-pips" value="20" min="5" max="200">
    <div class="setting-hint">JPYペア: 1pip = 0.01円</div>
  </div>
  <div class="setting-item">
    <label class="setting-label">テイクプロフィット（pips）</label>
    <input type="number" class="setting-input" id="s-tp-pips" value="40" min="5" max="500">
  </div>
  <div class="setting-item">
    <label class="setting-label">バックテスト期間（時間）</label>
    <input type="number" class="setting-input" id="s-bt-hours" value="12" min="1" max="168">
  </div>
</div>

<div class="section-card">
  <div class="section-title">シグナル設定</div>
  <div class="setting-item">
    <label class="setting-label">最小勝率（%）</label>
    <input type="number" class="setting-input" id="s-min-wr" value="55" min="50" max="100">
    <div class="setting-hint">この勝率以上の指標のみ表示</div>
  </div>
  <div class="setting-item">
    <label class="setting-label">最小取引数</label>
    <input type="number" class="setting-input" id="s-min-trades" value="3" min="1" max="50">
  </div>
  <div class="setting-item">
    <label class="setting-label">Geminiモデル</label>
    <select class="setting-input" id="s-gemini-model">
      <option value="gemini-1.5-flash">gemini-1.5-flash（高速）</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash（最新）</option>
      <option value="gemini-1.5-pro">gemini-1.5-pro（高精度）</option>
    </select>
  </div>
</div>

<div class="section-card">
  <div class="section-title">レポート配信</div>
  <div class="setting-item">
    <label class="setting-label">配信時刻（UTC）</label>
    <input type="text" class="setting-input" id="s-report-times" value="06:00,12:00,18:00">
    <div class="setting-hint">カンマ区切り例: 06:00,12:00,18:00</div>
  </div>
</div>

<div class="px-3 pb-3">
  <button class="btn btn-primary w-100 py-3" onclick="saveSettings()">
    <i class="bi bi-check-lg me-2"></i>設定を保存
  </button>
</div>
<div style="height:20px"></div>

</main>

<!-- ボトムナビゲーション -->
<nav class="bottom-nav">
  <a href="/index.html" class="bottom-nav-item">
    <i class="bi bi-speedometer2"></i>
    <span>ホーム</span>
  </a>
  <a href="/signals.html" class="bottom-nav-item">
    <i class="bi bi-lightning-charge"></i>
    <span>シグナル</span>
  </a>
  <a href="/backtest.html" class="bottom-nav-item">
    <i class="bi bi-bar-chart-line"></i>
    <span>分析</span>
  </a>
  <a href="/reports.html" class="bottom-nav-item">
    <i class="bi bi-file-earmark-text"></i>
    <span>レポート</span>
  </a>
  <a href="/settings.html" class="bottom-nav-item active">
    <i class="bi bi-gear"></i>
    <span>設定</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getUTCHours()).padStart(2,'0');
    const m = String(now.getUTCMinutes()).padStart(2,'0');
    const s = String(now.getUTCSeconds()).padStart(2,'0');
    document.getElementById('current-time').textContent = `${h}:${m}:${s} UTC`;
  }
  setInterval(updateClock, 1000);
  updateClock();

async function loadSettings() {
  try {
    const res = await fetch('/settings_data.json?_=' + Date.now());
    const data = await res.json();
    if (data.initial_capital) document.getElementById('s-initial-capital').value = data.initial_capital;
    if (data.sl_pips) document.getElementById('s-sl-pips').value = data.sl_pips;
    if (data.tp_pips) document.getElementById('s-tp-pips').value = data.tp_pips;
    if (data.backtest_hours) document.getElementById('s-bt-hours').value = data.backtest_hours;
    if (data.min_win_rate) document.getElementById('s-min-wr').value = data.min_win_rate;
    if (data.min_trades) document.getElementById('s-min-trades').value = data.min_trades;
    if (data.report_times) document.getElementById('s-report-times').value = data.report_times;
    if (data.gemini_model) {
      const sel = document.getElementById('s-gemini-model');
      for (let opt of sel.options) {
        if (opt.value === data.gemini_model) { sel.value = opt.value; break; }
      }
    }
  } catch(e) { console.error('設定読み込みエラー:', e); }
}

async function saveSettings() {
  const el = document.getElementById('save-status');
  el.style.display = 'block';
  el.className = 'action-status loading';
  el.textContent = '保存中...';
  const payload = {
    initial_capital: document.getElementById('s-initial-capital').value,
    sl_pips: document.getElementById('s-sl-pips').value,
    tp_pips: document.getElementById('s-tp-pips').value,
    backtest_hours: document.getElementById('s-bt-hours').value,
    min_win_rate: document.getElementById('s-min-wr').value,
    min_trades: document.getElementById('s-min-trades').value,
    report_times: document.getElementById('s-report-times').value,
    gemini_model: document.getElementById('s-gemini-model').value,
  };
  try {
    const body = 'action=save_settings&data=' + encodeURIComponent(JSON.stringify(payload));
    const res = await fetch('/action.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: body
    });
    const result = await res.json();
    if (result.ok) {
      el.className = 'action-status success';
      el.textContent = '保存しました';
    } else {
      el.className = 'action-status error';
      el.textContent = 'エラー: ' + (result.error || '不明');
    }
  } catch(e) {
    el.className = 'action-status error';
    el.textContent = 'エラー: ' + e;
  }
}
loadSettings();
</script>
</body>
</html>
